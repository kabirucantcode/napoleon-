# Render blueprint for the standalone Napoleon API.
#
# This is deliberately independent of Spectra's render.yaml — different service,
# different database, no shared secrets.
services:
  - type: web
    name: napoleon-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    # The app sets a global `api/v1` prefix, so the health route is prefixed too.
    # Pointing Render at `/health` makes it poll a 404 and kill the deploy.
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: napoleon-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false
      # Render injects PORT itself; the app reads it and falls back to 3010.

databases:
  - name: napoleon-db
    plan: free
    region: oregon
