# Render blueprint for the standalone Napoleon API.
#
# This is deliberately independent of Spectra's render.yaml — different service,
# different database, no shared secrets.
services:
  - type: web
    name: napoleon-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    # The app sets a global `api/v1` prefix, so the health route is prefixed too.
    # Pointing Render at `/health` makes it poll a 404 and kill the deploy.
    healthCheckPath: /api/v1/health
    envVars:
      # Injected from the database below. Use the *internal* URL, which only
      # works because both are in the same region.
      - key: DATABASE_URL
        fromDatabase:
          name: napoleon-db
          property: connectionString
      # CORS_ORIGIN is deliberately not set here. Napoleon is a server-to-server
      # API and server callers never preflight, so an empty value is the correct
      # default and the app simply disables CORS. Add the variable in the Render
      # dashboard only if a browser will call this from another origin.
      #
      # PORT is injected by Render; the app reads it and falls back to 3010.

databases:
  - name: napoleon-db
    plan: free
    region: oregon
